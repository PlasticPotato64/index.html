<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Media Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: 12px;
    background: #3a6ea5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .window {
    width: 100%;
    max-width: 400px;
    background: #ece9d8;
    border: 1px solid #6a6a6a;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    border-radius: 6px 6px 3px 3px;
    overflow: hidden;
  }

  /* Title bar */
  .titlebar {
    background: linear-gradient(180deg, #4a9fd4 0%, #2163aa 45%, #1a52a0 50%, #2e6bbf 100%);
    padding: 5px 6px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 5px 5px 0 0;
    user-select: none;
  }

  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 5px;
    color: white;
    font-size: 11px;
    font-weight: 700;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
    letter-spacing: 0.2px;
  }

  .titlebar-btns { display: flex; gap: 2px; }

  .tbtn {
    width: 21px; height: 17px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.4);
    cursor: pointer; font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #000; font-weight: bold;
    background: linear-gradient(180deg, #f0f0f0 0%, #d8d8d8 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    font-family: 'Segoe UI', sans-serif;
  }
  .tbtn:hover { background: linear-gradient(180deg, #fff 0%, #e8e8e8 100%); }
  .tbtn.close { background: linear-gradient(180deg, #e25050 0%, #b82020 100%); color: white; font-size: 10px; }
  .tbtn.close:hover { background: linear-gradient(180deg, #f06060 0%, #cc3030 100%); }

  /* Menu bar */
  .menubar {
    background: #ece9d8;
    border-bottom: 1px solid #aca899;
    padding: 1px 4px;
    display: flex;
  }
  .menu-item {
    padding: 2px 7px; cursor: pointer;
    color: #000; font-size: 11px;
    border-radius: 2px;
  }
  .menu-item:hover { background: #316ac5; color: white; }

  .win-body {
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: #ece9d8;
  }

  /* Now playing */
  .now-playing {
    background: #1a1a1a;
    border: 1px solid #555;
    padding: 8px 10px;
    border-radius: 2px;
  }
  .np-status {
    font-size: 9px; color: #4a88cc;
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 3px; font-family: 'Courier New', monospace;
  }
  .np-title {
    color: #e8e8e8; font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .np-meta {
    display: flex; justify-content: space-between;
    font-size: 9px; color: #446688;
    font-family: 'Courier New', monospace;
  }

  /* Progress */
  .progress-wrap {
    background: #fff;
    border: 1px solid #7a7a7a;
    border-right-color: #ddd;
    border-bottom-color: #ddd;
    height: 13px; cursor: pointer; position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(180deg, #5a9fd4 0%, #2060b0 100%);
    transition: width 0.1s linear;
  }
  .progress-fill::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: rgba(255,255,255,0.2);
  }
  .time-row {
    display: flex; justify-content: space-between;
    font-size: 9px; color: #666;
    font-family: 'Courier New', monospace;
    margin-top: 1px;
  }

  /* Controls */
  .controls-panel {
    background: linear-gradient(180deg, #f0ede0 0%, #e4e0cc 100%);
    border: 1px solid #aca899;
    padding: 5px 6px;
  }
  .controls-row {
    display: flex; align-items: center;
    justify-content: center; gap: 3px;
  }

  .ctrl-btn {
    background: linear-gradient(180deg, #f5f2e8 0%, #dedad0 100%);
    border: 1px solid #aaa;
    border-bottom-color: #888; border-right-color: #888;
    cursor: pointer; font-size: 11px;
    padding: 4px 10px; min-height: 24px; color: #000;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    white-space: nowrap; user-select: none;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 2px;
    letter-spacing: 0.3px;
  }
  .ctrl-btn:hover {
    background: linear-gradient(180deg, #ddeeff 0%, #c8dff5 100%);
    border-color: #6a9fd0;
  }
  .ctrl-btn:active {
    background: linear-gradient(180deg, #c0d8f0 0%, #aacce8 100%);
    border-top-color: #888; border-left-color: #888;
    border-bottom-color: #ddd; border-right-color: #ddd;
    transform: translateY(1px);
  }
  .ctrl-btn:disabled { color: #999; cursor: default; background: linear-gradient(180deg, #f0ede0 0%, #e8e4d8 100%); }
  .ctrl-btn.active {
    background: linear-gradient(180deg, #c0d8f5 0%, #a8ccee 100%);
    border-color: #4a8fd0; color: #003080;
    border-top-color: #888; border-left-color: #888;
  }
  .play-btn { min-width: 52px; font-size: 13px; }

  /* Playlist */
  .section-label {
    font-size: 10px; color: #444; font-weight: 600;
    padding: 0 1px;
    display: flex; justify-content: space-between;
  }
  .playlist {
    background: white;
    border: 1px solid #7a7a7a;
    border-right-color: #ddd; border-bottom-color: #ddd;
    height: 148px; overflow-y: auto;
  }
  .playlist::-webkit-scrollbar { width: 13px; }
  .playlist::-webkit-scrollbar-track { background: #ece9d8; border-left: 1px solid #bbb; }
  .playlist::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #e0ddd0 0%, #c8c4b0 100%);
    border: 1px solid #aaa;
  }

  .pl-item {
    padding: 3px 8px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid #f4f4f4;
    font-size: 11px; color: #000;
  }
  .pl-item:hover { background: #c8ddf5; }
  .pl-item.active { background: #316ac5; color: white; }
  .pl-item.active .pl-num { color: #a8c8ff; }
  .pl-num { font-size: 10px; color: #888; min-width: 20px; font-family: 'Courier New', monospace; }
  .pl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-empty { padding: 14px 10px; color: #999; font-size: 11px; }

  /* Open files btn */
  .open-btn {
    width: 100%;
    background: linear-gradient(180deg, #f5f2e8 0%, #dedad0 100%);
    border: 1px solid #aaa;
    border-bottom-color: #888; border-right-color: #888;
    padding: 5px 10px; font-size: 11px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    cursor: pointer; color: #000;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center; gap: 5px;
    border-radius: 2px;
  }
  .open-btn:hover { background: linear-gradient(180deg, #ddeeff 0%, #c8dff5 100%); border-color: #6a9fd0; }
  .open-btn:active { transform: translateY(1px); }

  /* Audio output panel */
  .bt-panel {
    background: linear-gradient(180deg, #f0ede0 0%, #e8e4d8 100%);
    border: 1px solid #aca899;
    border-radius: 2px; overflow: hidden;
  }
  .bt-header {
    padding: 4px 8px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    border-bottom: 1px solid transparent;
  }
  .bt-header:hover { background: #ddeeff; }
  .bt-header.open { border-bottom-color: #aca899; }
  .bt-header-left { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #000; }
  .bt-dot { width: 7px; height: 7px; border-radius: 50%; background: #bbb; border: 1px solid #888; transition: background 0.3s; }
  .bt-dot.connected { background: #22aa44; border-color: #118833; box-shadow: 0 0 3px #22aa44; }
  .bt-dot.scanning { background: #2266ff; border-color: #1144cc; animation: blink 0.8s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .bt-chevron { font-size: 9px; color: #666; transition: transform 0.2s; }
  .bt-chevron.open { transform: rotate(180deg); }

  .bt-body { padding: 6px; display: flex; flex-direction: column; gap: 4px; }

  .bt-scan-btn {
    background: linear-gradient(180deg, #f5f2e8 0%, #dedad0 100%);
    border: 1px solid #aaa; border-bottom-color: #888;
    padding: 3px 10px; font-size: 11px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    cursor: pointer; color: #000; border-radius: 2px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex; align-items: center; gap: 5px;
  }
  .bt-scan-btn:hover { background: linear-gradient(180deg, #ddeeff 0%, #c8dff5 100%); border-color: #6a9fd0; }
  .bt-scan-btn:active { transform: translateY(1px); }

  .bt-spinner { display: inline-block; width: 9px; height: 9px; border: 2px solid #ccc; border-top-color: #316ac5; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bt-status { font-size: 10px; color: #666; min-height: 13px; }

  .bt-device-list {
    background: white; border: 1px solid #aaa;
    border-right-color: #ddd; border-bottom-color: #ddd;
    max-height: 120px; overflow-y: auto;
  }
  .bt-device {
    padding: 4px 8px; display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid #f4f4f4; cursor: pointer; font-size: 11px; color: #000;
  }
  .bt-device:hover { background: #c8ddf5; }
  .bt-device.selected { background: #316ac5; color: white; }
  .bt-device.selected .bt-device-type { color: #a8c8ff; }
  .bt-device-info { flex: 1; }
  .bt-device-name { font-size: 11px; }
  .bt-device-type { font-size: 9px; color: #888; }
  .bt-use-btn {
    background: linear-gradient(180deg, #f5f2e8 0%, #dedad0 100%);
    border: 1px solid #aaa; border-bottom-color: #888;
    padding: 2px 7px; font-size: 10px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    cursor: pointer; color: #000; border-radius: 2px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    white-space: nowrap;
  }
  .bt-use-btn:hover { background: linear-gradient(180deg, #ddeeff 0%, #c8dff5 100%); border-color: #6a9fd0; }
  .bt-use-btn.active-btn { background: linear-gradient(180deg, #c8e8c8 0%, #a8d8a8 100%); border-color: #55aa55; color: #003300; }

  /* Status bar */
  .statusbar {
    background: #ece9d8;
    border-top: 1px solid #aca899;
    padding: 2px 6px;
    display: flex; gap: 4px; font-size: 10px; color: #444;
  }
  .status-cell {
    padding: 1px 5px;
    border: 1px solid #aaa;
    border-right-color: #eee; border-bottom-color: #eee;
    background: white;
  }

  @media (max-width: 500px) {
    body { padding: 0; align-items: flex-start; }
    .window { max-width: 100%; border-radius: 0; min-height: 100vh; border: none; box-shadow: none; }
    .playlist { height: 180px; }
  }
</style>
</head>
<body>
<div class="window">

  <div class="titlebar">
    <div class="titlebar-left">
      Media Player
    </div>
    <div class="titlebar-btns">
      <div class="tbtn">_</div>
      <div class="tbtn">&#9633;</div>
      <div class="tbtn close">&#10005;</div>
    </div>
  </div>

  <div class="menubar">
    <div class="menu-item">File</div>
    <div class="menu-item">View</div>
    <div class="menu-item">Play</div>
    <div class="menu-item">Tools</div>
    <div class="menu-item">Help</div>
  </div>

  <div class="win-body">

    <div class="now-playing">
      <div class="np-status" id="np-status">stopped</div>
      <div class="np-title" id="np-title">No media selected</div>
      <div class="np-meta">
        <span id="np-tracknum">—</span>
        <span id="np-time">0:00 / 0:00</span>
      </div>
    </div>

    <div>
      <div class="progress-wrap" id="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-dur">0:00</span>
      </div>
    </div>

    <div class="controls-panel">
      <div class="controls-row">
        <button class="ctrl-btn" id="btn-prev" disabled onclick="skip(-1)">|&lt;&lt;</button>
        <button class="ctrl-btn play-btn" id="btn-play" disabled onclick="togglePlay()">&gt;</button>
        <button class="ctrl-btn" id="btn-next" disabled onclick="skip(1)">&gt;&gt;|</button>
        <button class="ctrl-btn" id="btn-repeat" onclick="toggleRepeat()">Repeat</button>
      </div>
    </div>

    <div class="section-label">
      <span>Playlist</span>
      <span id="pl-count">0 items</span>
    </div>
    <div class="playlist" id="playlist">
      <div class="pl-empty">No files loaded.</div>
    </div>

    <input type="file" id="file-input" accept=".mp3,audio/mpeg" multiple style="display:none" onchange="importFiles(event)"/>
    <button class="open-btn" onclick="document.getElementById('file-input').click()">
      Open Files...
    </button>

    <!-- Audio Output -->
    <div class="bt-panel">
      <div class="bt-header" id="bt-header" onclick="toggleBT()">
        <div class="bt-header-left">
          <div class="bt-dot" id="bt-dot"></div>
          Audio Output
          <span id="bt-active-label" style="color:#555;font-weight:400;font-size:10px;"></span>
        </div>
        <div class="bt-chevron" id="bt-chevron">&#9660;</div>
      </div>
      <div id="bt-body" style="display:none">
        <div class="bt-body">
          <button class="bt-scan-btn" id="scan-btn" onclick="scanDevices()">
            <span id="scan-icon">&#9906;</span> Scan for Devices
          </button>
          <div class="bt-status" id="bt-status">Click scan to find audio output devices.</div>
          <div class="bt-device-list" id="bt-device-list" style="display:none"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="statusbar">
    <div class="status-cell" id="status-main">Ready</div>
    <div class="status-cell" id="status-count">0 tracks</div>
    <div class="status-cell" id="status-output">Default output</div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById('audio');
let tracks = [], current = null, repeat = false;
let selectedDeviceId = null, selectedDeviceName = 'Default';

function fmt(s) {
  if (isNaN(s)||s<0) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

function updateUI() {
  const t = current !== null ? tracks[current] : null;
  const playing = !audio.paused;
  document.getElementById('np-status').textContent = playing ? 'playing' : t ? 'paused' : 'stopped';
  document.getElementById('np-title').textContent = t ? t.name : 'No media selected';
  document.getElementById('np-tracknum').textContent = t ? `${current+1} / ${tracks.length}` : '—';
  document.getElementById('btn-play').innerHTML = playing ? '&#9646;&#9646;' : '&#9654;';
  document.getElementById('btn-play').disabled = !t;
  document.getElementById('btn-prev').disabled = tracks.length < 2;
  document.getElementById('btn-next').disabled = tracks.length < 2;
  document.getElementById('btn-repeat').className = 'ctrl-btn'+(repeat?' active':'');
  document.getElementById('status-main').textContent = playing ? 'Playing' : t ? 'Ready' : 'No media';
  document.getElementById('status-count').textContent = tracks.length+' track'+(tracks.length!==1?'s':'');
  document.getElementById('pl-count').textContent = tracks.length+' items';
  renderPlaylist();
}

function renderPlaylist() {
  const pl = document.getElementById('playlist');
  if (!tracks.length) { pl.innerHTML='<div class="pl-empty">No files loaded.</div>'; return; }
  pl.innerHTML = tracks.map((t,i)=>`
    <div class="pl-item ${i===current?'active':''}" onclick="loadAndPlay(${i})">
      <span class="pl-num">${i+1}</span>
      <span class="pl-name">${t.name}</span>
    </div>`).join('');
}

function loadAndPlay(i) {
  if (i<0||i>=tracks.length) return;
  current = i;
  audio.src = tracks[i].url;
  audio.load();
  audio.play();
  updateUI();
}

function togglePlay() {
  if (current===null) return;
  audio.paused ? audio.play() : audio.pause();
  updateUI();
}

function skip(d) {
  if (!tracks.length) return;
  loadAndPlay(((current??0)+d+tracks.length)%tracks.length);
}

function toggleRepeat() { repeat=!repeat; updateUI(); }

function importFiles(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const was = tracks.length===0;
  files.forEach(f=>tracks.push({name:f.name.replace(/\.mp3$/i,''),url:URL.createObjectURL(f)}));
  was ? loadAndPlay(0) : updateUI();
  e.target.value='';
}

audio.addEventListener('timeupdate',()=>{
  const pct = audio.duration?(audio.currentTime/audio.duration*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('time-cur').textContent=fmt(audio.currentTime);
  document.getElementById('np-time').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);
});
audio.addEventListener('loadedmetadata',()=>{ document.getElementById('time-dur').textContent=fmt(audio.duration); });
audio.addEventListener('ended',()=>{ repeat?(audio.currentTime=0,audio.play()):skip(1); });
audio.addEventListener('play',updateUI);
audio.addEventListener('pause',updateUI);

document.getElementById('progress-bar').addEventListener('click',e=>{
  if(!audio.duration) return;
  const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

let btOpen = false;
function toggleBT() {
  btOpen = !btOpen;
  document.getElementById('bt-body').style.display = btOpen ? 'block' : 'none';
  document.getElementById('bt-chevron').className = 'bt-chevron'+(btOpen?' open':'');
  document.getElementById('bt-header').className = 'bt-header'+(btOpen?' open':'');
}

async function scanDevices() {
  const btn = document.getElementById('scan-btn');
  const statusEl = document.getElementById('bt-status');
  const listEl = document.getElementById('bt-device-list');
  const dot = document.getElementById('bt-dot');

  btn.innerHTML = '<span class="bt-spinner"></span> Scanning...';
  btn.disabled = true;
  dot.className = 'bt-dot scanning';
  statusEl.textContent = 'Scanning for audio output devices...';
  listEl.style.display = 'none';

  let realDevices = [];
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    realDevices = devices.filter(d=>d.kind==='audiooutput');
  } catch(e) {}

  await new Promise(r=>setTimeout(r,1600));

  btn.innerHTML = '&#9906; Scan for Devices';
  btn.disabled = false;

  const list = realDevices.length > 0
    ? realDevices.map(d=>({id:d.deviceId, name:d.label||'Audio Device', type:'Audio Output'}))
    : [{id:'default', name:'System Default', type:'Audio Output'}];

  dot.className = 'bt-dot';
  statusEl.textContent = `Found ${list.length} device${list.length!==1?'s':''}.`;
  renderDevices(list);
}

function renderDevices(devices) {
  const listEl = document.getElementById('bt-device-list');
  listEl.style.display = 'block';
  listEl.innerHTML = devices.map(d=>`
    <div class="bt-device ${d.id===selectedDeviceId?'selected':''}" onclick="selectDevice('${d.id}','${d.name.replace(/'/g,"\\'")}')">
      <div class="bt-device-info">
        <div class="bt-device-name">${d.name}</div>
        <div class="bt-device-type">${d.type}</div>
      </div>
      <button class="bt-use-btn ${d.id===selectedDeviceId?'active-btn':''}" onclick="event.stopPropagation();selectDevice('${d.id}','${d.name.replace(/'/g,"\\'")}')">
        ${d.id===selectedDeviceId?'Active':'Use'}
      </button>
    </div>`).join('');
}

async function selectDevice(id, name) {
  selectedDeviceId = id;
  selectedDeviceName = name;
  if (typeof audio.setSinkId === 'function') {
    try { await audio.setSinkId(id); } catch(e) {}
  }
  document.getElementById('bt-dot').className = 'bt-dot connected';
  document.getElementById('bt-status').textContent = 'Active: '+name;
  document.getElementById('status-output').textContent = name.length > 20 ? name.substring(0,20)+'...' : name;
  document.getElementById('bt-active-label').textContent = '— '+name.substring(0,24)+(name.length>24?'...':'');
  const listEl = document.getElementById('bt-device-list');
  listEl.querySelectorAll('.bt-device').forEach(el=>{
    const eid = el.getAttribute('onclick').match(/'([^']+)'/)[1];
    el.className = 'bt-device'+(eid===id?' selected':'');
    const btn = el.querySelector('.bt-use-btn');
    btn.textContent = eid===id ? 'Active' : 'Use';
    btn.className = 'bt-use-btn'+(eid===id?' active-btn':'');
  });
}

updateUI();
</script>
</body>
</html>
