<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Media Player</title>
<meta name="theme-color" content="#ffffff"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Media Player"/>
<link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Media+Player%22%2C%22short_name%22%3A%22Player%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23ffffff%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg+xmlns%3D%2527http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527+viewBox%3D%25270+0+192+192%2527%253E%253Crect+width%3D%2527192%2527+height%3D%2527192%2527+rx%3D%252724%2527+fill%3D%2527%2523333%2527%2F%253E%253Ccircle+cx%3D%252796%2527+cy%3D%252796%2527+r%3D%252755%2527+fill%3D%2527none%2527+stroke%3D%2527white%2527+stroke-width%3D%25278%2527%2F%253E%253Cpolygon+points%3D%252778%2C68+78%2C124+130%2C96%2527+fill%3D%2527white%2527%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D"/>
<script>
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', e => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const blob = new Blob([swCode], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    font-size: 13px;
    background: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 10px;
  }

  .window {
    width: 100%;
    max-width: 420px;
    background: white;
    border: 1px solid #999;
  }

  .titlebar {
    background: #333;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .titlebar-left { color: white; font-size: 13px; font-weight: bold; }
  .titlebar-btns { display: flex; gap: 4px; }
  .tbtn {
    width: 20px; height: 20px;
    border: 1px solid #888; cursor: pointer; font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: bold; background: #555;
  }
  .tbtn:hover { background: #777; }
  .tbtn.close { background: #aa2222; }
  .tbtn.close:hover { background: #cc3333; }

  .menubar {
    background: #eee;
    border-bottom: 1px solid #ccc;
    padding: 2px 4px;
    display: flex;
  }
  .menu-item { padding: 2px 8px; cursor: pointer; color: #000; font-size: 12px; }
  .menu-item:hover { background: #ccc; }

  .win-body {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: white;
  }

  .now-playing {
    background: #222;
    border: 1px solid #555;
    padding: 8px 10px;
  }
  .np-status { font-size: 10px; color: #aaa; text-transform: uppercase; margin-bottom: 3px; }
  .np-title { color: white; font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .np-meta { display: flex; justify-content: space-between; font-size: 10px; color: #888; }

  .progress-wrap {
    background: #ddd; border: 1px solid #aaa;
    height: 14px; cursor: pointer; position: relative; overflow: hidden;
  }
  .progress-fill { height: 100%; background: #555; transition: width 0.1s linear; }
  .time-row { display: flex; justify-content: space-between; font-size: 10px; color: #666; margin-top: 2px; }

  .controls-panel { background: #eee; border: 1px solid #ccc; padding: 6px; }
  .controls-row { display: flex; align-items: center; justify-content: center; gap: 4px; }

  .ctrl-btn {
    background: white; border: 1px solid #999; cursor: pointer; font-size: 12px;
    padding: 5px 12px; min-height: 28px; color: #000;
    display: flex; align-items: center; justify-content: center;
    white-space: nowrap; user-select: none; font-family: Arial, sans-serif;
  }
  .ctrl-btn:hover { background: #ddd; }
  .ctrl-btn:active { background: #bbb; }
  .ctrl-btn:disabled { color: #bbb; cursor: default; background: #f5f5f5; }
  .ctrl-btn.active { background: #555; color: white; }
  .play-btn { min-width: 50px; font-size: 14px; }

  .section-label { font-size: 11px; color: #555; font-weight: bold; padding: 0 1px; display: flex; justify-content: space-between; }
  .playlist { background: white; border: 1px solid #aaa; height: 150px; overflow-y: auto; }
  .pl-item { padding: 4px 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; font-size: 12px; color: #000; }
  .pl-item:hover { background: #eee; }
  .pl-item.active { background: #333; color: white; }
  .pl-item.active .pl-num { color: #aaa; }
  .pl-num { font-size: 10px; color: #aaa; min-width: 20px; }
  .pl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-empty { padding: 14px 10px; color: #aaa; font-size: 12px; }

  .open-btn {
    width: 100%; background: #eee; border: 1px solid #aaa;
    padding: 6px 10px; font-size: 12px; font-family: Arial, sans-serif;
    cursor: pointer; color: #000;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .open-btn:hover { background: #ddd; }
  .open-btn:active { background: #ccc; }

  .bt-panel { background: #f5f5f5; border: 1px solid #ccc; }
  .bt-header { padding: 5px 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; border-bottom: 1px solid transparent; font-size: 12px; }
  .bt-header:hover { background: #e8e8e8; }
  .bt-header.open { border-bottom-color: #ccc; }
  .bt-header-left { display: flex; align-items: center; gap: 6px; color: #000; }
  .bt-dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; border: 1px solid #888; transition: background 0.3s; }
  .bt-dot.connected { background: #33aa55; border-color: #228833; }
  .bt-dot.scanning { background: #3366ff; border-color: #1144cc; animation: blink 0.8s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .bt-chevron { font-size: 10px; color: #666; transition: transform 0.2s; }
  .bt-chevron.open { transform: rotate(180deg); }
  .bt-body { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .bt-scan-btn { background: #eee; border: 1px solid #aaa; padding: 4px 10px; font-size: 12px; font-family: Arial, sans-serif; cursor: pointer; color: #000; display: flex; align-items: center; gap: 5px; }
  .bt-scan-btn:hover { background: #ddd; }
  .bt-spinner { display: inline-block; width: 9px; height: 9px; border: 2px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bt-status { font-size: 11px; color: #666; min-height: 14px; }
  .bt-device-list { background: white; border: 1px solid #aaa; max-height: 120px; overflow-y: auto; }
  .bt-device { padding: 5px 8px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 12px; color: #000; }
  .bt-device:hover { background: #eee; }
  .bt-device.selected { background: #333; color: white; }
  .bt-device.selected .bt-device-type { color: #aaa; }
  .bt-device-info { flex: 1; }
  .bt-device-name { font-size: 12px; }
  .bt-device-type { font-size: 10px; color: #888; }
  .bt-use-btn { background: #eee; border: 1px solid #aaa; padding: 2px 8px; font-size: 11px; font-family: Arial, sans-serif; cursor: pointer; color: #000; white-space: nowrap; }
  .bt-use-btn:hover { background: #ddd; }
  .bt-use-btn.active-btn { background: #afa; border-color: #6a6; color: #030; }

  .statusbar { background: #eee; border-top: 1px solid #ccc; padding: 2px 6px; display: flex; gap: 4px; font-size: 10px; color: #555; }
  .status-cell { padding: 1px 5px; border: 1px solid #ccc; background: white; }

  @media (max-width: 500px) {
    body { padding: 0; }
    .window { max-width: 100%; min-height: 100vh; border: none; }
    .playlist { height: 180px; }
  }
</style>
</head>
<body>
<div class="window">

  <div class="titlebar">
    <div class="titlebar-left">Media Player</div>
    <div class="titlebar-btns">
      <div class="tbtn">_</div>
      <div class="tbtn">&#9633;</div>
      <div class="tbtn close">&#10005;</div>
    </div>
  </div>

  <div class="menubar">
    <div class="menu-item">File</div>
    <div class="menu-item">View</div>
    <div class="menu-item">Play</div>
    <div class="menu-item">Tools</div>
    <div class="menu-item">Help</div>
  </div>

  <div class="win-body">

    <div class="now-playing">
      <div class="np-status" id="np-status">stopped</div>
      <div class="np-title" id="np-title">No media selected</div>
      <div class="np-meta">
        <span id="np-tracknum">—</span>
        <span id="np-time">0:00 / 0:00</span>
      </div>
    </div>

    <div>
      <div class="progress-wrap" id="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-dur">0:00</span>
      </div>
    </div>

    <div class="controls-panel">
      <div class="controls-row">
        <button class="ctrl-btn" id="btn-prev" disabled onclick="skip(-1)">|&lt;&lt;</button>
        <button class="ctrl-btn play-btn" id="btn-play" disabled onclick="togglePlay()">&gt;</button>
        <button class="ctrl-btn" id="btn-next" disabled onclick="skip(1)">&gt;&gt;|</button>
        <button class="ctrl-btn" id="btn-repeat" onclick="toggleRepeat()">Repeat</button>
      </div>
    </div>

    <div class="section-label">
      <span>Playlist</span>
      <span id="pl-count">0 items</span>
    </div>
    <div class="playlist" id="playlist">
      <div class="pl-empty">No files loaded.</div>
    </div>

    <input type="file" id="file-input" accept=".mp3,audio/mpeg" multiple style="display:none" onchange="importFiles(event)"/>
    <button class="open-btn" onclick="document.getElementById('file-input').click()">
      Open Files...
    </button>

    <div class="bt-panel">
      <div class="bt-header" id="bt-header" onclick="toggleBT()">
        <div class="bt-header-left">
          <div class="bt-dot" id="bt-dot"></div>
          Audio Output
          <span id="bt-active-label" style="color:#555;font-size:10px;"></span>
        </div>
        <div class="bt-chevron" id="bt-chevron">&#9660;</div>
      </div>
      <div id="bt-body" style="display:none">
        <div class="bt-body">
          <button class="bt-scan-btn" id="scan-btn" onclick="scanDevices()">
            <span id="scan-icon">&#9906;</span> Scan for Devices
          </button>
          <div class="bt-status" id="bt-status">Click scan to find audio output devices.</div>
          <div class="bt-device-list" id="bt-device-list" style="display:none"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="statusbar">
    <div class="status-cell" id="status-main">Ready</div>
    <div class="status-cell" id="status-count">0 tracks</div>
    <div class="status-cell" id="status-output">Default output</div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById('audio');
let tracks = [], current = null, repeat = false;
let selectedDeviceId = null, selectedDeviceName = 'Default';

function fmt(s) {
  if (isNaN(s)||s<0) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

function updateUI() {
  const t = current !== null ? tracks[current] : null;
  const playing = !audio.paused;
  document.getElementById('np-status').textContent = playing ? 'playing' : t ? 'paused' : 'stopped';
  document.getElementById('np-title').textContent = t ? t.name : 'No media selected';
  document.getElementById('np-tracknum').textContent = t ? `${current+1} / ${tracks.length}` : '—';
  document.getElementById('btn-play').innerHTML = playing ? '&#9646;&#9646;' : '&#9654;';
  document.getElementById('btn-play').disabled = !t;
  document.getElementById('btn-prev').disabled = tracks.length < 2;
  document.getElementById('btn-next').disabled = tracks.length < 2;
  document.getElementById('btn-repeat').className = 'ctrl-btn'+(repeat?' active':'');
  document.getElementById('status-main').textContent = playing ? 'Playing' : t ? 'Ready' : 'No media';
  document.getElementById('status-count').textContent = tracks.length+' track'+(tracks.length!==1?'s':'');
  document.getElementById('pl-count').textContent = tracks.length+' items';
  renderPlaylist();
}

function renderPlaylist() {
  const pl = document.getElementById('playlist');
  if (!tracks.length) { pl.innerHTML='<div class="pl-empty">No files loaded.</div>'; return; }
  pl.innerHTML = tracks.map((t,i)=>`
    <div class="pl-item ${i===current?'active':''}" onclick="loadAndPlay(${i})">
      <span class="pl-num">${i+1}</span>
      <span class="pl-name">${t.name}</span>
    </div>`).join('');
}

function loadAndPlay(i) {
  if (i<0||i>=tracks.length) return;
  current = i;
  audio.src = tracks[i].url;
  audio.load();
  audio.play();
  updateUI();
}

function togglePlay() {
  if (current===null) return;
  audio.paused ? audio.play() : audio.pause();
  updateUI();
}

function skip(d) {
  if (!tracks.length) return;
  loadAndPlay(((current??0)+d+tracks.length)%tracks.length);
}

function toggleRepeat() { repeat=!repeat; updateUI(); }

function importFiles(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const was = tracks.length===0;
  files.forEach(f=>tracks.push({name:f.name.replace(/\.mp3$/i,''),url:URL.createObjectURL(f)}));
  was ? loadAndPlay(0) : updateUI();
  e.target.value='';
}

audio.addEventListener('timeupdate',()=>{
  const pct = audio.duration?(audio.currentTime/audio.duration*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('time-cur').textContent=fmt(audio.currentTime);
  document.getElementById('np-time').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);
});
audio.addEventListener('loadedmetadata',()=>{ document.getElementById('time-dur').textContent=fmt(audio.duration); });
audio.addEventListener('ended',()=>{ repeat?(audio.currentTime=0,audio.play()):skip(1); });
audio.addEventListener('play',updateUI);
audio.addEventListener('pause',updateUI);

document.getElementById('progress-bar').addEventListener('click',e=>{
  if(!audio.duration) return;
  const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

let btOpen = false;
function toggleBT() {
  btOpen = !btOpen;
  document.getElementById('bt-body').style.display = btOpen ? 'block' : 'none';
  document.getElementById('bt-chevron').className = 'bt-chevron'+(btOpen?' open':'');
  document.getElementById('bt-header').className = 'bt-header'+(btOpen?' open':'');
}

async function scanDevices() {
  const btn = document.getElementById('scan-btn');
  const statusEl = document.getElementById('bt-status');
  const listEl = document.getElementById('bt-device-list');
  const dot = document.getElementById('bt-dot');

  btn.innerHTML = '<span class="bt-spinner"></span> Scanning...';
  btn.disabled = true;
  dot.className = 'bt-dot scanning';
  statusEl.textContent = 'Scanning for audio output devices...';
  listEl.style.display = 'none';

  let realDevices = [];
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    realDevices = devices.filter(d=>d.kind==='audiooutput');
  } catch(e) {}

  await new Promise(r=>setTimeout(r,1600));

  btn.innerHTML = '&#9906; Scan for Devices';
  btn.disabled = false;

  const list = realDevices.length > 0
    ? realDevices.map(d=>({id:d.deviceId, name:d.label||'Audio Device', type:'Audio Output'}))
    : [{id:'default', name:'System Default', type:'Audio Output'}];

  dot.className = 'bt-dot';
  statusEl.textContent = `Found ${list.length} device${list.length!==1?'s':''}.`;
  renderDevices(list);
}

function renderDevices(devices) {
  const listEl = document.getElementById('bt-device-list');
  listEl.style.display = 'block';
  listEl.innerHTML = devices.map(d=>`
    <div class="bt-device ${d.id===selectedDeviceId?'selected':''}" onclick="selectDevice('${d.id}','${d.name.replace(/'/g,"\\'")}')">
      <div class="bt-device-info">
        <div class="bt-device-name">${d.name}</div>
        <div class="bt-device-type">${d.type}</div>
      </div>
      <button class="bt-use-btn ${d.id===selectedDeviceId?'active-btn':''}" onclick="event.stopPropagation();selectDevice('${d.id}','${d.name.replace(/'/g,"\\'")}')">
        ${d.id===selectedDeviceId?'Active':'Use'}
      </button>
    </div>`).join('');
}

async function selectDevice(id, name) {
  selectedDeviceId = id;
  selectedDeviceName = name;
  if (typeof audio.setSinkId === 'function') {
    try { await audio.setSinkId(id); } catch(e) {}
  }
  document.getElementById('bt-dot').className = 'bt-dot connected';
  document.getElementById('bt-status').textContent = 'Active: '+name;
  document.getElementById('status-output').textContent = name.length > 20 ? name.substring(0,20)+'...' : name;
  document.getElementById('bt-active-label').textContent = '— '+name.substring(0,24)+(name.length>24?'...':'');
  const listEl = document.getElementById('bt-device-list');
  listEl.querySelectorAll('.bt-device').forEach(el=>{
    const eid = el.getAttribute('onclick').match(/'([^']+)'/)[1];
    el.className = 'bt-device'+(eid===id?' selected':'');
    const btn = el.querySelector('.bt-use-btn');
    btn.textContent = eid===id ? 'Active' : 'Use';
    btn.className = 'bt-use-btn'+(eid===id?' active-btn':'');
  });
}

updateUI();
</script>
</body>
</html>
